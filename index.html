<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ado AI Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --sidebar-bg: #0b0b0b;
            --main-bg: #111111;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-blue: #3d8bff;
            --border-color: #222222;
            --button-bg: #1a1a1a;
            --code-bg: #1e1e1e;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; font-family: 'Segoe UI', sans-serif; background-color: var(--main-bg); color: var(--text-main); display: flex; overflow: hidden; }

        /* --- Layout --- */
        .sidebar { width: var(--sidebar-width); min-width: var(--sidebar-width); height: 100%; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 15px; transition: transform 0.3s ease; z-index: 1001; }
        .main-content { flex-grow: 1; height: 100%; display: flex; flex-direction: column; position: relative; min-width: 0; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }

        /* --- Messages --- */
        .msg-container { position: relative; display: flex; flex-direction: column; max-width: 85%; }
        .user-container { align-self: flex-end; }
        .ai-container { align-self: flex-start; }

        .msg { padding: 12px 16px; border-radius: 15px; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; position: relative; }
        .user { background-color: var(--button-bg); border: 1px solid var(--border-color); color: white; }
        .ai { background-color: transparent; color: #ececec; border-left: 2px solid var(--accent-blue); border-radius: 0; }

        /* --- Code Box Styling --- */
        pre { background: var(--code-bg); padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border-color); font-family: 'Consolas', 'Monaco', monospace; margin: 10px 0; position: relative; }
        code { font-family: inherit; color: #dcdcdc; }

        /* --- Copy Button --- */
        .copy-btn {
            position: absolute; bottom: -25px; left: 0;
            background: var(--button-bg); border: 1px solid var(--border-color);
            color: var(--text-secondary); padding: 4px 8px; border-radius: 5px;
            font-size: 10px; cursor: pointer; opacity: 0; transition: 0.2s;
            display: flex; align-items: center; gap: 5px; z-index: 10;
        }
        .ai-container:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { color: white; background: #333; }

        /* --- Input Area --- */
        .input-container { padding: 20px; width: 100%; }
        .input-wrapper { background-color: var(--button-bg); border: 1px solid var(--border-color); border-radius: 16px; display: flex; align-items: flex-end; padding: 10px 15px; max-width: 850px; margin: 0 auto; }
        #userInput { background: none; border: none; color: white; flex-grow: 1; padding: 10px; outline: none; font-size: 1rem; resize: none; max-height: 200px; overflow-y: auto; }
        .send-btn { background-color: white; color: black; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; margin-left: 10px; display: flex; align-items: center; justify-content: center; }

        @media (max-width: 767px) { .sidebar { position: fixed; left: 0; transform: translateX(-100%); } .sidebar.active { transform: translateX(0); } }
        .menu-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <span><i class="fa-solid fa-robot" style="color:var(--accent-blue)"></i> Ado</span>
        </div>
        <button onclick="location.reload()" style="background:var(--button-bg); color:white; border:1px solid var(--border-color); padding:10px; border-radius:8px; cursor:pointer;"><i class="fa-solid fa-plus"></i> New Chat</button>
    </aside>

    <main class="main-content">
        <nav class="top-nav" style="padding: 15px 20px; display: flex; align-items: center;">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <div style="flex:1"></div>
            <div style="width:35px; height:35px; border-radius:50%; background:#444;"></div>
        </nav>

        <div id="chat-window">
            <section class="hero-section" id="hero" style="text-align:center; margin-top: 50px;">
                <div style="font-size: 4rem; color: var(--accent-blue);"><i class="fa-solid fa-robot"></i></div>
                <h1>Ado Friend & Teacher</h1>
            </section>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="userInput" rows="1" placeholder="Message Ado..." oninput="autoResize(this)"></textarea>
                <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
        </div>
    </main>

 <script>
const chatWindow = document.getElementById('chat-window');
const userInput = document.getElementById('userInput');
const hero = document.getElementById('hero');

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
}

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight) + 'px';
}

function formatAIResponse(text) {
    const codeRegex = /```([\s\S]*?)```/g;
    return text.replace(codeRegex, (match, code) => {
        return `<pre><code>${code.trim()}</code></pre>`;
    });
}

function addMessage(text, type) {
    if (hero) hero.style.display = 'none';
    const container = document.createElement('div');
    container.className = `msg-container ${type}-container`;

    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${type}`;

    if (type === 'ai') {
        msgDiv.innerHTML = formatAIResponse(text);
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
        btn.onclick = () => {
            navigator.clipboard.writeText(text);
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
            setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
        };
        container.appendChild(msgDiv);
        container.appendChild(btn);
    } else {
        msgDiv.textContent = text;
        container.appendChild(msgDiv);
    }

    chatWindow.appendChild(container);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    userInput.value = '';
    userInput.style.height = 'auto';

    try {
        // ✅ Backend link updated to Railway
        const response = await fetch('https://ado-ai-production.up.railway.app/ask', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text })
        });
        const data = await response.json();
        addMessage(data.answer, 'ai');
    } catch (error) {
        addMessage('⚠️ Connection error.', 'ai');
        console.error(error);
    }
}

userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
</script>

</body>

</html>
